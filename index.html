<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efede8; --text:#1d1c1a; --muted:#6b6862;
  --line:#dedbd4; --accent:#e4572e; --accent-text:#ffffff; --ok:#2e8b57; --warn:#c0392b;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --surface:#1f1f1c; --surface2:#2a2a26; --text:#f1efe9; --muted:#a3a097;
    --line:#3a3a35; --accent:#ff7a50; --accent-text:#1a0f0a; --ok:#5cc28a; --warn:#ff6b5b;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --surface:#1f1f1c; --surface2:#2a2a26; --text:#f1efe9; --muted:#a3a097;
  --line:#3a3a35; --accent:#ff7a50; --accent-text:#1a0f0a; --ok:#5cc28a; --warn:#ff6b5b;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.app{max-width:960px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:center;gap:8px}
.title-row h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daytabs{display:flex;gap:6px;margin:12px 0 0;overflow-x:auto}
.daytabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:5px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.daytabs button small{color:var(--muted);font-weight:400;margin-left:4px}
.daytabs button.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.daytabs button.active small{color:var(--bg);opacity:.75}
.countdown{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;display:none}
.countdown.show{display:block}
.countdown b{font-variant-numeric:tabular-nums;font-size:16px;color:var(--accent)}
.countdown .now{color:var(--ok);font-weight:600}
#viewSeg{margin-top:10px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 4px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 10px}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:40px}
input[type=time]{min-width:0}
.f-label{font-size:12px;color:var(--muted);margin-bottom:2px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
label.f > input,label.f > textarea,label.f > select{margin-top:2px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.grow{flex:1}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--warn)}
.btn.icon{padding:8px 11px;flex:none;min-width:40px;display:flex;align-items:center;justify-content:center}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--muted);text-align:center;padding:32px 12px;background:var(--surface);border-radius:var(--radius)}
.empty .btns{justify-content:center;margin-top:12px}
/* はじめての案内 */
.intro{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border-left:4px solid var(--accent);padding:12px 14px;margin-top:12px;font-size:13.5px}
.intro ol{margin:6px 0 10px;padding-left:20px}
.intro li{margin:3px 0}
/* 会場コンテンツ */
.cc-map{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:10px 14px;border-radius:10px;background:rgba(42,139,184,.14);border:1px solid rgba(42,139,184,.35);border-left:4px solid #2a8bb8;color:var(--text);font-size:14px;font-weight:700;text-decoration:none}
.cc-map small{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.cc-free{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:1.5px dashed var(--muted);background:var(--surface);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;text-align:left}
.cc-free b{font-size:14px}
.cc-free span{font-size:12px;color:var(--muted)}
.cc-cat{font-size:14px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.cc-cat::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.cc-cat small{color:var(--muted);font-weight:400}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cc-card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 10px 8px;cursor:pointer;box-shadow:var(--shadow);user-select:none;-webkit-tap-highlight-color:transparent}
.cc-card.on{border-color:var(--c);background:var(--cbg)}
.cc-card .n{font-size:13px;font-weight:700;line-height:1.35;word-break:break-word;padding-right:24px}
.cc-card .ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.cc-card.on .ck{background:var(--c);border-color:var(--c);color:#fff}
.cc-card .pl{font-size:11.5px;color:var(--muted)}
.cc-card .st{font-size:11px;color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}
.tbtn{margin-top:auto;align-self:flex-start;flex:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
/* マイタイテ */
.wants{display:flex;flex-direction:column;gap:6px}
.want{display:flex;align-items:center;gap:8px;background:var(--surface);border-left:4px solid var(--c);border-radius:8px;padding:8px 6px 8px 10px;box-shadow:var(--shadow)}
.want .n{font-size:13px;font-weight:700;line-height:1.35;word-break:break-word}
.want .pl{font-size:11.5px;color:var(--muted)}
.want .tbtn{margin:0;align-self:center}
.want .x{border:0;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;padding:6px 8px;flex:none}
.warn{color:var(--warn);font-size:12.5px;font-weight:600;margin:-2px 0 8px}

/* grid */
/* 表は高さ制限なしでページごとスクロール。列見出しは固定ヘッダーの直下に貼り付く */
.grid-wrap{border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.grid-inner{--tw:48px;background:var(--surface);border-radius:var(--radius)}
.g-head,.g-body{display:grid;grid-template-columns:var(--tw) repeat(var(--cols),minmax(0,1fr))}
.g-head{position:sticky;top:var(--hh,150px);z-index:3;background:var(--surface);border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.ex-grid .g-head,.ex-grid .g-corner{position:static}
.ex-grid .g-head,.ex-grid .grid-inner{border-radius:0}
/* html2canvas は省略記号(…)の列見出しを正しく描けないので、画像では折り返す */
.ex-grid .g-stage{white-space:normal;overflow:visible;text-overflow:clip}
.g-corner{position:sticky;left:0;background:var(--surface);z-index:4}
.g-stage{padding:8px 6px;font-weight:700;font-size:13px;text-align:center;border-top:4px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-stage.mine{color:var(--muted)}
.g-times{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
.g-time{position:absolute;left:0;right:0;font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.g-col{position:relative;border-right:1px solid var(--line)}
.g-col:last-child{border-right:0}
.g-line{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.g-line.half{border-top-style:dashed;opacity:.35}
.slot{position:absolute;left:3px;right:3px;border:0;border-left:4px solid var(--c);border-radius:6px;padding:3px 6px;text-align:left;font:inherit;color:var(--text);cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.slot .t{font-size:10.5px;opacity:.8;font-variant-numeric:tabular-nums}
.slot .n{font-size:12.5px;font-weight:700;line-height:1.25;word-break:break-word}
.slot.on{color:#fff}
.slot.on .n::before{content:"✓ "}
.slot.mine{border:1.5px dashed var(--muted);border-left:4px solid var(--muted);background:var(--surface2);right:auto}
.slot.mine .pl{font-size:10.5px;color:var(--muted);word-break:break-word}
.slot.compact{display:block;padding:2px 6px;line-height:1.25}
.slot.compact .t{display:inline;margin-right:4px;font-size:10px}
.slot.compact .n{display:inline;font-size:11.5px}
.slot.compact .pl{display:inline;margin-left:4px}
.slot .memo-dot{position:absolute;right:4px;bottom:2px;font-size:11px}
.now-line{position:absolute;left:0;right:0;border-top:2px solid var(--warn);z-index:1;pointer-events:none}

/* toast & sheets */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal .box{background:var(--surface);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;width:100%;max-height:92vh;overflow:auto}
@media (min-width:600px){ .modal{align-items:center;padding:16px} .modal .box{border-radius:var(--radius)} }
.modal h2{font-size:16px;margin:0 0 4px}
.modal img{width:100%;border-radius:8px;display:block;margin:8px 0}

/* export (offscreen) */
#exportArea{position:absolute;left:-10000px;top:0}
/* 画像はスマホ1画面（縦長 9:16 前後）に収まる大きさで書き出す */
.ex-grid{padding:16px;background:var(--surface);width:420px}
/* タイトル行：右に日付タブと同じ見た目の Day 表記 */
.ex-grid .ex-title{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ex-grid h3{margin:0;font-size:18px;flex:1}
.ex-grid .daytabs{margin:0}
.slot.tile{color:var(--text);border-left:4px solid var(--c)}
.slot.tile.free{border:1.5px dashed var(--c);border-left:4px solid var(--c)}
.slot.tile .pl{font-size:10.5px;color:var(--muted);word-break:break-word}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.my-bar{display:flex;align-items:flex-start;gap:8px;margin:0 0 8px}
.my-bar .legend{flex:1;margin:6px 0 0}
.slot .mk{position:absolute;top:2px;right:5px;font-size:14px;font-weight:800;opacity:.5}
.slot.has-mk .n{padding-right:12px}
.toast.act{pointer-events:auto}
.toast .undo{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;margin-left:10px;padding:0;cursor:pointer}
.ex-wants{margin-top:14px;font-size:13px}
.ex-wants h4{margin:0 0 4px;font-size:13px;color:var(--muted)}
.ex-wants ul{margin:0;padding-left:18px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title-row"><h1 id="evTitle">FF14 ファンフェス マイタイテ</h1></div>
    <div class="countdown" id="countdown"></div>
    <div class="seg" id="viewSeg">
      <button data-v="stage">ステージ</button><button data-v="contents">会場コンテンツ</button><button data-v="my">マイタイテ</button>
    </div>
  </header>

  <div class="intro" id="intro" hidden>
    <b>はじめての方へ</b>
    <ol>
      <li><b>ステージ</b>・<b>会場コンテンツ</b>から、行きたいものをタップしてマイタイテに追加</li>
      <li><b>マイタイテ</b>で自分の予定を確認（時間を決めるとタイムテーブルに並びます）</li>
      <li>できあがったら<b>画像で保存</b>して、当日の確認やSNSに</li>
    </ol>
    <button class="btn primary" id="introOk">はじめる</button>
  </div>

  <div class="daytabs" id="dayTabs"></div>
  <p class="hint" id="hint"></p>
  <div id="grid"></div>
</div>

<!-- 予定の追加・編集 -->
<div class="modal" id="formModal">
  <div class="box">
    <h2 id="fHead"></h2>
    <p class="hint" id="fSub"></p>
    <div id="freeFields">
      <label class="f">予定の名前<input type="text" id="cTitle" placeholder="例：お昼ごはん、友だちと待ち合わせ"></label>
      <label class="f">場所（任意）<input type="text" id="cPlace" list="placeList" placeholder="例：幕張メッセ"></label>
      <datalist id="placeList"></datalist>
    </div>
    <div class="f-label">日にち</div>
    <div class="seg" id="fDaySeg" style="margin-bottom:10px"></div>
    <div class="row">
      <label class="f grow">開始<input type="time" id="cStart"></label>
      <label class="f grow">終了（任意）<input type="time" id="cEnd"></label>
    </div>
    <label class="f">メモ（任意）<textarea id="cNote" rows="2"></textarea></label>
    <div class="warn" id="fWarn"></div>
    <div class="btns">
      <button class="btn primary" id="cSave"></button>
      <button class="btn ghost" id="cCancel">キャンセル</button>
      <button class="btn ghost danger" id="cDel" style="display:none;margin-left:auto">削除</button>
    </div>
  </div>
</div>

<!-- 画像プレビュー -->
<div class="modal" id="imgModal">
  <div class="box">
    <div class="row"><h2 class="grow">画像で保存</h2><button class="btn ghost" id="imgClose">閉じる</button></div>
    <p class="hint">表示中の日のマイタイテを画像にしました。スマホは画像を長押しでも保存できます。</p>
    <img id="imgPreview" alt="書き出した画像">
    <div class="btns"><button class="btn primary" id="imgDl">ダウンロード</button><button class="btn" id="imgShare">共有…</button></div>
  </div>
</div>

<div id="exportArea"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const KEY = 'fanfest-mytaite.v2';
const PX = 1.6; // 1分あたりのpx

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : NaN; };
const fmt = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const endMin = (start, end) => { const a = toMin(start); let b = toMin(end); if (isNaN(b)) return a; if (b <= a) b += 1440; return b; };
const normTime = t => { const m = toMin(String(t || '').trim().replace('：', ':')); return isNaN(m) ? null : fmt(m); };
const hexA = (hex, a) => { const n = parseInt(hex.replace('#', ''), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const slash = d => d.replace(/^\d{4}-/, '').replace('-', '/');
const absTime = (date, hhmm) => { const [y, m, d] = date.split('-').map(Number); const t = new Date(y, m - 1, d); t.setMinutes(toMin(hhmm)); return t.getTime(); };

/* ---------- 公式タイムテーブル（ここを書き換えれば全員に反映） ---------- */
const EVENT = { name: 'FF14 ファンフェス', days: [{ id: 'd1', label: 'Day1', date: '2026-10-31' }, { id: 'd2', label: 'Day2', date: '2026-11-01' }] };
const STAGE = { name: 'メインステージ', color: '#e0a800' };
const SLOTS = [];
const add = (dayId, start, end, title) => SLOTS.push({ id: dayId + '-' + start.replace(':', ''), dayId, start, end, title });
add('d1', '09:00', '', '開場');
add('d1', '11:00', '13:00', '基調講演');
add('d1', '13:00', '14:00', 'オープニング');
add('d1', '15:00', '16:30', 'クリコン セミファイナル');
add('d1', '16:30', '17:00', '吉P一問一答タイムアタック');
add('d1', '17:00', '18:30', 'クリコン ファイナル');
add('d1', '19:30', '20:30', 'ピアノコンサート');
add('d1', '20:30', '21:00', 'エンディング');
add('d2', '09:00', '', '開場');
add('d2', '10:00', '10:30', 'オープニング');
add('d2', '10:30', '12:00', '開発パネル');
add('d2', '12:30', '13:30', 'LIVE Q&A');
add('d2', '13:50', '15:00', 'ミラプリコレクション');
add('d2', '15:30', '17:30', '直樹の部屋');
add('d2', '19:30', '20:30', 'THE PRIMALSライブ');
add('d2', '20:30', '21:00', 'エンディング');

/* ---------- 会場コンテンツ（カードで表示。タップでマイタイテへ） ---------- */
const PRESETS = {
  'アクティビティ': [
    ['ファイナルファンタジーXIV：チョコボレースVR', '幕張メッセ'],
    ['エッダの鞄', '幕張メッセ'],
    ['YOKERO -エターナルクイーン討滅戦-', '幕張メッセ'],
    ['ダンシング・グリーンと踊ろう！ （Ver.1.0）', '幕張メッセ'],
    ['リアル謎解きゲーム（新作）', 'イオンモール'],
    ['カード体験＆展示ブース', '幕張メッセ'],
    ['instax™“チェキ”での撮影・プリント体験', '幕張メッセ'],
    ['ドマ式麻雀 修練場', '幕張メッセ'],
    ['エオルゼア検定～読んで…… 答えて…… 見直して…… ～', '幕張メッセ'],
    ['ナイスヘッド・ガーデン', '幕張メッセ'],
    ['古のアラグの操作盤', '幕張メッセ'],
    ['F.A.T.E.『スペースインベーダー ギガマックス ：トライヨラの民を守れ！』', '幕張メッセ'],
    ['『だいたい合ってるNPC名鑑 ＜新生エオルゼア編＞』体験コーナー', '幕張メッセ'],

// mode: 'stage' = 公式タイムテーブル全部 / 'my' = マイタイテ（✓した枠＋時間を決めた予定）
// opts.flat = 画像用（現在時刻線・スクロール固定なし）。予定がなければ '' を返す
// opts.fit = 画像用：表の本体をおおよそこの高さ(px)に縮める
function gridHTML(mode, opts = {}) {
  const cd = curDay();
  // 表に並べる予定。マイタイテでは ✓したステージ枠と時間を決めた予定を1列にまとめる
  const items = SLOTS.filter(s => s.dayId === cd.id && (mode === 'stage' || me.my.includes(s.id))).map(s => ({ kind: 'stage', s, start: s.start, end: s.end, title: s.title, color: STAGE.color }));
  if (mode === 'my') me.custom.filter(c => c.dayId === cd.id).forEach(c => {
    const p = presetOf(c);
    items.push({ kind: p ? 'content' : 'free', c, start: c.start, end: c.end, title: c.title, color: p ? catColor(p) : FREE_COLOR });
  });
  if (!items.length) return '';
  items.sort((a, b) => toMin(a.start) - toMin(b.start));
  const iEnd = it => it.end ? endMin(it.start, it.end) : toMin(it.start) + 20;
  // 短い予定もブロックの最小の高さぶんは枠内に収める（深夜帯の見切れ対策）
  const VMIN = Math.ceil(30 / PX);
  let min = Infinity, max = -Infinity;
  items.forEach(it => { min = Math.min(min, toMin(it.start)); max = Math.max(max, iEnd(it), toMin(it.start) + VMIN); });
  min = Math.floor(min / 60) * 60; max = Math.ceil(max / 60) * 60;
  // opts.fit = 表の本体をこの高さ(px)に収めたいとき（画像用）。縮めすぎない下限つき
  const px = opts.fit ? Math.min(PX, Math.max(0.7, opts.fit / (max - min))) : PX;
  const headColor = mode === 'stage' ? STAGE.color : 'var(--accent)';
  let h = `<div class="grid-inner" style="--cols:1"><div class="g-head"><div class="g-corner"></div><div class="g-stage" style="--c:${headColor}">${mode === 'stage' ? esc(STAGE.name) : 'マイタイテ'}</div></div>`;
  h += `<div class="g-body" style="height:${(max - min) * px + 14}px"><div class="g-times" style="position:${opts.flat ? 'relative' : 'sticky'}">`;
  for (let t = min; t <= max; t += 60) h += `<div class="g-time" style="top:${(t - min) * px + 4}px">${fmt(t)}</div>`;
  h += '</div><div class="g-col">';
  for (let t = min; t <= max; t += 30) h += `<div class="g-line ${t % 60 ? 'half' : ''}" style="top:${(t - min) * px + 4}px"></div>`;
  if (!opts.flat && cd.date === todayStr()) { const d = new Date(), n = d.getHours() * 60 + d.getMinutes(); if (n >= min && n <= max) h += `<div class="now-line" style="top:${(n - min) * px + 4}px"></div>`; }
  items.forEach(it => {
    const a = toMin(it.start), b = iEnd(it), pos = `data-h="${(b - a) * px - 2}" style="top:${(a - min) * px + 5}px;height:${(b - a) * px - 2}px;--c:${it.color};`;
    const time = `<span class="t">${it.start}${it.end ? '–' + it.end : ''}</span><span class="n">${esc(it.title)}</span>`;
    if (mode === 'stage') {
      const on = me.my.includes(it.s.id);
      h += `<button class="slot ${on ? 'on' : 'has-mk'}" data-id="${it.s.id}" ${pos}background:${on ? it.color : hexA(it.color, .16)}">${time}${on ? '' : '<span class="mk">＋</span>'}</button>`;
    } else if (it.kind === 'stage') {
      h += `<button class="slot tile" data-id="${it.s.id}" ${pos}background:${hexA(it.color, .22)}">${time}</button>`;
    } else {
      const c = it.c;
      h += `<div class="slot tile ${it.kind}" data-cid="${esc(c.id)}" ${pos}background:${hexA(it.color, .16)}">${time}${c.place ? `<span class="pl">📍${esc(c.place)}</span>` : ''}${c.note && !opts.flat ? '<span class="memo-dot">📝</span>' : ''}</div>`;
    }
  });
  return h + '</div></div></div>';
}

// 描画後の調整：
// ① 時間が本当に重なる予定だけ横に並べる
// ② 短くて入りきらないカードは、まず1行にまとめた表示（compact）にする
// ③ それでも入らなければ中身が全部見える高さまで伸ばし、下の予定にかぶる分だけ下へずらす
function layoutGrid(root) {
  root.querySelectorAll('.g-body').forEach(body => {
    let maxBottom = 0;
    body.querySelectorAll('.g-col').forEach(col => {
      const cards = [...col.querySelectorAll('.slot')].map(el => ({ el, top: parseFloat(el.style.top), dur: Math.max(parseFloat(el.dataset.h) || 0, 0), real: (parseFloat(el.dataset.h) || 0) + 2 }))
        .sort((a, b) => a.top - b.top || b.dur - a.dur);
      for (let i = 0; i < cards.length;) {
        let j = i, end = cards[i].top + cards[i].real;
        while (j + 1 < cards.length && cards[j + 1].top < end - 1) { j++; end = Math.max(end, cards[j].top + cards[j].real); }
        const group = cards.slice(i, j + 1), lanes = [];
        group.forEach(c => { let l = lanes.findIndex(b => b <= c.top + 1); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = c.top + c.real; c.lane = l; });
        group.forEach(c => { c.n = lanes.length; });
        i = j + 1;
      }
      cards.forEach(c => {
        const w = 100 / c.n; c.x0 = c.lane * w; c.x1 = c.x0 + w;
        Object.assign(c.el.style, { left: `calc(${c.x0}% + 3px)`, width: `calc(${w}% - 6px)`, right: 'auto', height: 'auto' });
        c.el.classList.remove('compact');
        let need = c.el.offsetHeight;
        if (need > c.dur) { c.el.classList.add('compact'); need = c.el.offsetHeight; }
        c.h = Math.max(c.dur, need); c.el.style.height = c.h + 'px';
      });
      const placed = [];
      cards.forEach(c => {
        let y = c.top, hit;
        while ((hit = placed.find(p => p.x0 < c.x1 - .01 && c.x0 < p.x1 - .01 && y < p.y + p.h + 2 && p.y < y + c.h))) y = hit.y + hit.h + 2;
        c.y = y; c.el.style.top = y + 'px'; placed.push(c);
        maxBottom = Math.max(maxBottom, y + c.h);
      });
    });
    const h = parseFloat(body.style.height); if (maxBottom + 8 > h) body.style.height = (maxBottom + 8) + 'px';
  });
}

// フォームの日にち切り替え（Day1 / Day2）
const renderFormDay = () => { $('#fDaySeg').innerHTML = EVENT.days.map(d => `<button type="button" data-day="${d.id}" class="${d.id === formDayId ? 'active' : ''}">${esc(d.label)}（${slash(d.date)}）</button>`).join(''); };
$('#fDaySeg').addEventListener('click', e => { const b = e.target.closest('button[data-day]'); if (b) { formDayId = b.dataset.day; renderFormDay(); checkClash(); } });
function openForm({ id, preset }) {
  const c = id ? me.custom.find(x => x.id === id) : null;
  editingId = c ? c.id : null;
  formPreset = (c ? presetOf(c) : preset) || null;
  formDayId = c ? c.dayId : curDay().id; renderFormDay();
  $('#freeFields').style.display = formPreset ? 'none' : '';
  $('#fHead').textContent = formPreset ? formPreset[0] : c ? 'ほかの予定を編集' : 'ほかの予定を追加';
  $('#fSub').textContent = formPreset ? `📍${formPreset[1]}　行く日にちと時間を選んでください` : '会場コンテンツ以外の予定（お昼ごはん・待ち合わせ など）';
  $('#cTitle').value = c ? c.title : ''; $('#cPlace').value = c ? c.place : '';
  $('#cStart').value = c ? c.start : ''; $('#cEnd').value = c ? c.end : ''; $('#cNote').value = c ? c.note : '';
  $('#cSave').textContent = c ? '更新' : 'マイタイテに追加'; $('#cDel').style.display = c ? '' : 'none';
  $('#placeList').innerHTML = [...new Set([...VENUES, ...me.custom.map(x => x.place).filter(Boolean)])].map(p => `<option value="${esc(p)}">`).join('');
  checkClash();
  $('#formModal').classList.add('show');
}
const closeForm = () => { $('#formModal').classList.remove('show'); editingId = null; formPreset = null; };
// ✓した枠・他の予定との時間の被りを表示
function checkClash() {
  const s = normTime($('#cStart').value), e = normTime($('#cEnd').value), w = $('#fWarn');
  $('#cEnd').min = s || '';
  if (!s || !e) { w.textContent = ''; return; }
  // 1日の中の予定だけなので、終了は開始より後でないといけない
  if (toMin(e) <= toMin(s)) { w.textContent = '⚠ 終了は開始より後の時刻にしてください'; return; }
  const dayId = formDayId;
  const a = toMin(s), b = toMin(e);
  const hits = [
    ...SLOTS.filter(x => x.dayId === dayId && me.my.includes(x.id)),
    ...me.custom.filter(x => x.dayId === dayId && x.end && x.id !== editingId)
  ].filter(x => a < endMin(x.start, x.end) && toMin(x.start) < b).map(x => x.title);
  w.textContent = hits.length ? `⚠ 「${hits.join('」「')}」と時間が被っています` : '';
}
['#cStart', '#cEnd'].forEach(s => $(s).addEventListener('change', checkClash));
$('#cCancel').addEventListener('click', closeForm);
$('#formModal').addEventListener('click', e => { if (e.target.id === 'formModal') closeForm(); });
$('#cSave').addEventListener('click', () => {
  const start = normTime($('#cStart').value), pre = formPreset;
  const title = pre ? pre[0] : $('#cTitle').value.trim(), place = pre ? pre[1] : $('#cPlace').value.trim();
  if (!title) return toast('予定の名前を入れてください');
  if (!start) return toast('開始時刻を選んでください');
  const end = normTime($('#cEnd').value) || '';
  if (end && toMin(end) <= toMin(start)) return toast('終了は開始より後の時刻にしてください');
  const data = { dayId: formDayId, start, end, title: title.slice(0, 100), place: place.slice(0, 100), note: $('#cNote').value.slice(0, 2000) };
  const id = editingId;
  closeForm();
  change(() => {
    const c = id && me.custom.find(x => x.id === id);
    if (c) Object.assign(c, data); else me.custom.push({ id: uid(), ...data });
    // 時間を決めたので「やりたいこと」からは外す
    if (pre) me.wants = me.wants.filter(k => k !== pKey(pre));
  }, `${id ? '更新' : 'マイタイテに追加'}しました（${dayLabel(data.dayId)} ${start}〜）`);
});
$('#cDel').addEventListener('click', () => {
  const id = editingId; if (!id) return;
  closeForm();
  change(() => { me.custom = me.custom.filter(c => c.id !== id); }, '削除しました');
});

/* ---------- カウントダウン ---------- */
function myItems() {
  const items = SLOTS.filter(s => me.my.includes(s.id)).map(s => ({ ...s, place: '' }));
  me.custom.forEach(c => items.push(c));
  return items.map(it => {
    const d = EVENT.days.find(x => x.id === it.dayId), s = absTime(d.date, it.start);
    return { it, label: d.label, date: d.date, s, e: it.end ? s + (endMin(it.start, it.end) - toMin(it.start)) * 60000 : s };
  }).sort((a, b) => a.s - b.s);
}
function dur(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`; }
function tick() {
  const items = myItems(), now = Date.now(), box = $('#countdown'), today = todayStr();
  const first = EVENT.days[0].date, last = EVENT.days[EVENT.days.length - 1].date;
  const todayDay = EVENT.days.find(d => d.date === today);
  const pl = it => it.place ? `（📍${esc(it.place)}）` : '';
  let html = '';
  if (today < first) html += `<div>イベントまで あと <b>${Math.round((absTime(first, '00:00') - absTime(today, '00:00')) / 86400000)}日</b></div>`;
  else if (todayDay) html += `<div>🎉 本日 <b>${esc(todayDay.label)}</b>（${slash(today)}）</div>`;
  const current = items.filter(x => now >= x.s && now < x.e), next = items.find(x => x.s > now);
  if (current.length) html += `<div class="now">▶ 今：${current.map(x => esc(x.it.title) + pl(x.it)).join(' / ')}（〜${esc(current[0].it.end)}）</div>`;
  if (next) {
    const diff = next.s - now;
    html += diff > 43200000
      ? `<div>次：${esc(next.label)} ${slash(next.date)} ${next.it.start} ${esc(next.it.title)}${pl(next.it)}</div>`
      : `<div>次：${esc(next.label)} ${next.it.start} ${esc(next.it.title)}${pl(next.it)} まで <b>${dur(diff)}</b></div>`;
  } else if (items.length && !current.length && today >= last) html += '<div>予定はすべて終了しました。おつかれさまでした！</div>';
  box.innerHTML = html; box.classList.toggle('show', !!html);
}
setInterval(tick, 1000);
setInterval(renderGrid, 60000);

/* ---------- 画像で保存（表示中の日のマイタイテ） ---------- */
let lastBlob = null, lastName = '';
const canShareFile = () => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob()], 'a.png', { type: 'image/png' })] })); } catch (_) { return false; } };
async function exportImage() {
  if (!window.html2canvas) return toast('画像ライブラリを読み込めませんでした。通信状況を確認してください');
  // 幅420pxの画像が 9:16 前後に収まるよう、表の本体の高さを決める
  const inner = gridHTML('my', { flat: true, fit: Math.max(420, 600 - me.wants.length * 20) });
  const wants = me.wants.map(k => PRESET_LIST.find(p => pKey(p) === k)).filter(Boolean);
  if (!inner && !wants.length) return toast('画像にする予定がありません');
  const cd = curDay();
  const area = $('#exportArea');
  area.innerHTML = `<div class="ex-grid"><div class="ex-title"><h3>${esc(EVENT.name)}</h3><div class="daytabs"><button class="active">${esc(cd.label)}<small>${slash(cd.date)}</small></button></div></div>${legendHTML()}${inner}`
    + (wants.length ? `<div class="ex-wants"><h4>やりたいこと（時間未定）</h4><ul>${wants.map(p => `<li>${esc(p[0])}（${esc(p[1])}）</li>`).join('')}</ul></div>` : '') + '</div>';
  layoutGrid(area);
  toast('画像を作成中…');
  try {
    const el = area.firstElementChild;
    const w = el.offsetWidth, h = el.offsetHeight;
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: getComputedStyle(document.body).backgroundColor, logging: false, width: w, height: h, windowWidth: w + 40, windowHeight: h + 40, scrollX: 0, scrollY: 0 });
    lastBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    lastName = `ファンフェス_${cd.label}_マイタイテ.png`;
    $('#imgPreview').src = URL.createObjectURL(lastBlob);
    $('#imgShare').style.display = canShareFile() ? '' : 'none';
    $('#imgModal').classList.add('show');
  } catch (err) { console.error(err); toast('画像の作成に失敗しました'); }
  finally { area.innerHTML = ''; }
}
$('#imgClose').addEventListener('click', () => $('#imgModal').classList.remove('show'));
$('#imgModal').addEventListener('click', e => { if (e.target.id === 'imgModal') $('#imgModal').classList.remove('show'); });
$('#imgDl').addEventListener('click', () => {
  if (!lastBlob) return; const a = document.createElement('a'); a.href = URL.createObjectURL(lastBlob); a.download = lastName;
  document.body.appendChild(a); a.click(); a.remove();
});
$('#imgShare').addEventListener('click', async () => {
  if (!lastBlob) return;
  try { await navigator.share({ files: [new File([lastBlob], lastName, { type: 'image/png' })], title: EVENT.name }); } catch (_) {}
});

// 固定ヘッダーの高さを列見出しの貼り付き位置に使う
const syncHeaderHeight = () => document.documentElement.style.setProperty('--hh', $('header.top').offsetHeight + 'px');
if (window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe($('header.top'));
syncHeaderHeight();
renderAll();
scrollToNow();
})();
</script>
